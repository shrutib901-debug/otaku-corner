<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Soft shadow for sticker look -->
    <filter id="stickerShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#3B2314" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Thick White Sticker Border Backing -->
  <g filter="url(#stickerShadow)">
    <!-- Outer Sticker Die-cut Silhouette -->
    <path d="M 50 14
             C 56 14, 63 9, 74 15
             C 83 20, 87 34, 82 45
             C 89 54, 89 68, 81 78
             C 71 89, 59 90, 50 90
             C 41 90, 29 89, 19 78
             C 11 68, 11 54, 18 45
             C 13 34, 17 20, 26 15
             C 37 9, 44 14, 50 14 Z"
          fill="#FFFFFF"
          stroke="#3B2314"
          stroke-width="5"
          stroke-linejoin="round"
          stroke-linecap="round" />

    <!-- Fox Head Base (Sunset Orange #FF6B35) -->
    <!-- Left Ear -->
    <path d="M 28 44 L 27 21 C 27 19, 31 18, 34 22 L 44 40 Z"
          fill="#FF6B35"
          stroke="#3B2314"
          stroke-width="3.5"
          stroke-linejoin="round" />
    <!-- Left Ear Inner Pink -->
    <path d="M 29 25 L 34 24 L 40 37 L 31 38 Z"
          fill="#FF8FA3" />

    <!-- Right Ear -->
    <path d="M 72 44 L 73 21 C 73 19, 69 18, 66 22 L 56 40 Z"
          fill="#FF6B35"
          stroke="#3B2314"
          stroke-width="3.5"
          stroke-linejoin="round" />
    <!-- Right Ear Inner Pink -->
    <path d="M 71 25 L 66 24 L 60 37 L 69 38 Z"
          fill="#FF8FA3" />

    <!-- Fox Main Face Bulb -->
    <path d="M 50 28
             C 70 28, 82 42, 82 58
             C 82 74, 68 84, 50 84
             C 32 84, 18 74, 18 58
             C 18 42, 30 28, 50 28 Z"
          fill="#FF6B35"
          stroke="#3B2314"
          stroke-width="3.5"
          stroke-linejoin="round" />

    <!-- Cute Cream Cheeks & Muzzle -->
    <path d="M 50 48
             C 58 48, 70 46, 78 57
             C 80 66, 73 80, 50 80
             C 27 80, 20 66, 22 57
             C 30 46, 42 48, 50 48 Z"
          fill="#FFF4E6"
          stroke="#3B2314"
          stroke-width="2.5"
          stroke-linejoin="round" />

    <!-- Pink Cheeks (Blush) -->
    <ellipse cx="27" cy="62" rx="5" ry="3.5" fill="#FF8FA3" opacity="0.9" />
    <ellipse cx="73" cy="62" rx="5" ry="3.5" fill="#FF8FA3" opacity="0.9" />

    <!-- Kawaii Eyes (Dark Brown with White Sparkles) -->
    <!-- Left Eye -->
    <circle cx="37" cy="53" r="4.5" fill="#3B2314" />
    <circle cx="35.5" cy="51.5" r="1.6" fill="#FFFFFF" />
    <circle cx="38.5" cy="54.5" r="0.8" fill="#FFFFFF" />

    <!-- Right Eye (Happy Winking Arc) -->
    <path d="M 59 54 Q 63 49 67 54"
          fill="none"
          stroke="#3B2314"
          stroke-width="3.2"
          stroke-linecap="round" />

    <!-- Little Button Nose -->
    <path d="M 48 64 C 48 62, 52 62, 52 64 L 50 66.5 Z"
          fill="#3B2314" />

    <!-- Cute Kitten/Fox 'w' Smile -->
    <path d="M 46 67.5 Q 48 70.5 50 68 Q 52 70.5 54 67.5"
          fill="none"
          stroke="#3B2314"
          stroke-width="2.2"
          stroke-linecap="round" />

    <!-- Cute Sparkle Star on Forehead -->
    <path d="M 50 32 L 51.5 35.5 L 55 37 L 51.5 38.5 L 50 42 L 48.5 38.5 L 45 37 L 48.5 35.5 Z"
          fill="#FFB703" />
  </g>
</svg>
